name: Release Datapack

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'pack.mcmeta'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from pack.mcmeta
        id: version
        run: |
          VERSION=$(jq -r '.pack.version // empty' pack.mcmeta)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: 'version' field not found or empty in pack.mcmeta" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "filename=NoSnowBreak-V${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build datapack zip
        if: steps.check_release.outputs.exists == 'false'
        run: |
          zip -r "${{ steps.version.outputs.filename }}" \
            pack.mcmeta \
            data/ \
            LICENSE \
            README.md

      - name: Create GitHub release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NoSnowBreak ${{ steps.version.outputs.tag }}
          body: |
            ## NoSnowBreak ${{ steps.version.outputs.tag }}

            Download **${{ steps.version.outputs.filename }}** and place it directly inside your world's `datapacks/` directory, then run `/reload` in-game.

            See [README](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/README.md) for full installation and configuration instructions.
          files: ${{ steps.version.outputs.filename }}
          make_latest: true
